name: Node CI

on:
  # push は master に限定している。限定しないと、ブランチへの push と
  # その PR の両方でトリガーされ、同じチェックが二重に走る。
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

# 同じブランチで新しい実行が始まったら、走っている古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          tools: linked
          languages: javascript, actions
          queries: security-and-quality
          config: |
            paths-ignore:
              - node_modules

      - name: Run npm install
        run: npm ci
        env:
          CI: true

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
