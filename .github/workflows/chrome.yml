name: Chrome Testsuite

# 自動実行を外している。
#
# このテストは上流 apache/cordova-plugin-device-orientation でも継続して失敗しており
# （2026-05-19 / 2026-07-27 とも failure、同時期の Android は success）、
# このフォーク側では直せない。
#
#   Error: [paramedic] The device failed to connect to local server in 540 secs
#
# 常に赤い CI は本当の失敗を見落とす原因になるため、自動トリガーだけ外した。
# browser プラットフォームの実装（src/browser/CompassProxy.js）は
# Math.random() を返すダミーなので、このテストが守っているものは実質ない。
#
# 上流で直ったかどうかは Actions から手動で実行して確かめられる。
# 直っていたら push / pull_request のトリガーを戻すこと。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Chrome Latest Test
    runs-on: ubuntu-latest

    # hoist configurations to top that are expected to be updated
    env:
      # Storing a copy of the repo
      repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      node-version: 24

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.node-version }}

      - name: Run install xvfb
        run: sudo apt-get install xvfb

      - name: Run Environment Information
        run: |
          node --version
          npm --version

      # Apache Cordova 公式のテスト構成をそのまま使っている。
      # 最新の cordova / paramedic で動作確認することが目的なので固定しない。
      - name: Run npm install  # zizmor: ignore[adhoc-packages]
        run: |
          npm i -g cordova@latest
          npm ci

      - name: Run paramedic install  # zizmor: ignore[adhoc-packages]
        if: ${{ endswith(env.repo, '/cordova-paramedic') != true }}
        run: npm i -g github:apache/cordova-paramedic

      - name: Run paramedic tests
        env:
          test_config: 'browser.config.json'
          # Generally, this should automatically work for cordova-paramedic & plugins. If the path is unique, this can be manually changed.
          test_plugin_path: ${{ endswith(env.repo, '/cordova-paramedic') && './spec/testable-plugin/' || './' }}
          paramedic: ${{ endswith(env.repo, '/cordova-paramedic') && 'node main.js' || 'cordova-paramedic' }}
        run: xvfb-run --auto-servernum $paramedic --config ./pr/local/$test_config --plugin $test_plugin_path
